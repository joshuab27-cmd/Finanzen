<title>Vier-Monats-Finanzplan</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: schmale App-Spalte wie eine Banking-App, große Zahl oben, Listen darunter, Tab-Leiste unten fixiert */
:root {
  --bg: #000000;
  --surface: #121212;
  --surface-2: #1c1c1e;
  --ink: #ffffff;
  --muted: #8d8d93;
  --line: #262628;
  --up: #2ed47a;
  --down: #ff5a4e;
  --chip: #2a2a2d;
  --font: "Manrope", "Segoe UI", system-ui, -apple-system, sans-serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #ffffff; --surface: #f4f4f5; --surface-2: #ebebed; --ink: #0a0a0a; --muted: #6e6e73;
    --line: #e6e6e8; --up: #14a356; --down: #e0362b; --chip: #ececee; color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #ffffff; --surface: #f4f4f5; --surface-2: #ebebed; --ink: #0a0a0a; --muted: #6e6e73;
  --line: #e6e6e8; --up: #14a356; --down: #e0362b; --chip: #ececee; color-scheme: light;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.4;
  font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px calc(96px + env(safe-area-inset-bottom, 0px));
}
.app { max-width: 560px; margin: 0 auto; display: grid; gap: 28px; }
h1, h2 { margin: 0; text-wrap: balance; }
h2 { font-size: 1.25rem; font-weight: 700; letter-spacing: -0.01em; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.muted { color: var(--muted); }
.up { color: var(--up); } .down { color: var(--down); }

/* Kopf */
.topbar { display: flex; justify-content: space-between; align-items: center; min-height: 36px; gap: 12px; }
.topbar .title { font-weight: 700; font-size: 1rem; }
.save { font-size: 0.78rem; color: var(--muted); display: flex; gap: 6px; align-items: center; }
.save::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--up); }
.save[data-s="pending"]::before { background: var(--muted); }
.save[data-s="local"]::before { background: var(--muted); }

/* Große Zahl */
.hero { display: grid; gap: 4px; }
.hero .cap { color: var(--muted); font-size: 0.95rem; font-weight: 500; }
.hero .big { font-size: clamp(2.3rem, 9vw, 3rem); font-weight: 800; letter-spacing: -0.03em; line-height: 1.05; }
.hero .delta { font-weight: 600; font-size: 0.98rem; }

/* Chart */
.chart { position: relative; margin-inline: -4px; touch-action: pan-y; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 0; background: transparent; color: var(--muted); padding: 7px 13px; border-radius: 999px; font-weight: 700; font-size: 0.85rem; }
.chip[aria-pressed="true"] { background: var(--chip); color: var(--ink); }
.chips.spread { justify-content: space-between; }

/* Listen */
.section { display: grid; gap: 10px; }
.section-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.list { display: grid; }
.item { display: flex; align-items: center; gap: 12px; padding: 13px 0; border-bottom: 1px solid var(--line); min-width: 0; }
.item:last-child { border-bottom: 0; }
.item .grow { flex: 1 1 auto; min-width: 0; display: grid; gap: 2px; }
.item .sub { font-size: 0.82rem; color: var(--muted); }
.item .val { font-weight: 700; text-align: right; white-space: nowrap; }
.item .val .sub { font-weight: 500; }
.icon { width: 40px; height: 40px; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; font-weight: 800; font-size: 0.85rem; flex: none; color: var(--ink); }
.item.link { background: none; border-left: 0; border-right: 0; border-top: 0; width: 100%; text-align: left; }
.chev { color: var(--muted); font-size: 1.2rem; }

.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.stat { background: var(--surface); border-radius: 16px; padding: 14px 16px; display: grid; gap: 4px; min-width: 0; }
.stat .k { font-size: 0.82rem; color: var(--muted); font-weight: 500; }
.stat .v { font-size: 1.25rem; font-weight: 800; letter-spacing: -0.02em; }
.bar { height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; display: flex; }
.bar span { display: block; height: 100%; }

/* Eingaben */
.card { background: var(--surface); border-radius: 16px; padding: 4px 16px; }
.field { display: flex; align-items: center; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.field:last-child { border-bottom: 0; }
.field label, .field .lbl { flex: 1 1 auto; color: var(--muted); font-size: 0.92rem; font-weight: 500; }
input.in {
  font: inherit; color: var(--ink); background: transparent; border: 0; padding: 4px 0; min-width: 0; width: 100%;
  font-weight: 600;
}
input.in::placeholder { color: var(--muted); font-weight: 500; }
input.amt { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
.field input.amt { flex: 0 0 7rem; width: 7rem; }
.euro { color: var(--muted); font-weight: 600; }
.erow { display: flex; align-items: center; gap: 8px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.erow:last-of-type { border-bottom: 0; }
.erow .in.name { flex: 1 1 auto; }
.erow .in.amt { flex: 0 0 6.5rem; width: 6.5rem; }
.x { border: 0; background: transparent; color: var(--muted); width: 30px; height: 30px; border-radius: 50%; font-size: 1.15rem; flex: none; }
.x:hover { background: var(--surface-2); color: var(--down); }
.add { border: 0; background: transparent; color: var(--ink); font-weight: 700; padding: 12px 0; text-align: left; width: 100%; display: flex; gap: 10px; align-items: center; }
.add::before { content: "+"; width: 26px; height: 26px; border-radius: 50%; background: var(--chip); display: grid; place-items: center; font-size: 1.05rem; }
.sumrow { display: flex; justify-content: space-between; font-weight: 700; padding: 4px 2px 0; }
.btn { border: 0; background: var(--ink); color: var(--bg); border-radius: 999px; padding: 11px 18px; font-weight: 700; }
.btn.soft { background: var(--chip); color: var(--ink); }
.btn.danger { background: transparent; color: var(--down); padding-inline: 0; }
.row-actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

.etf { background: var(--surface); border-radius: 16px; padding: 14px 16px 6px; display: grid; gap: 2px; }
.etf-head { display: flex; align-items: center; gap: 12px; padding-bottom: 6px; }
.etf-head .in { font-size: 1.05rem; font-weight: 700; }

.banner { background: var(--surface); border-radius: 16px; padding: 14px 16px; display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; font-size: 0.92rem; }
.note { font-size: 0.8rem; color: var(--muted); margin: 0; max-width: 62ch; }
table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
th, td { padding: 9px 6px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; padding-left: 0; }
th { color: var(--muted); font-weight: 600; font-size: 0.78rem; }
.tbl { overflow-x: auto; }

/* Tab-Leiste */
nav.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--bg); border-top: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: 8px; padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px));
}
nav.tabs .inner { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); }
nav.tabs button { border: 0; background: transparent; color: var(--muted); display: grid; justify-items: center; gap: 3px; padding: 4px 0; font-size: 0.74rem; font-weight: 700; }
nav.tabs button svg { width: 24px; height: 24px; }
nav.tabs button[aria-current="page"] { color: var(--ink); }
@media (prefers-reduced-motion: no-preference) { .chip, nav.tabs button { transition: background .15s, color .15s; } }
</style>

<div class="app">
  <div class="topbar">
    <span class="title" id="pageTitle">Übersicht</span>
    <span class="save" id="save" data-s="local">Wird geladen …</span>
  </div>
  <div class="banner" id="banner" hidden>
    <span><strong>Beispielwerte.</strong> Ersetze sie durch deine Zahlen.</span>
    <button class="btn soft" id="clearExample">Leer starten</button>
  </div>
  <main id="view" class="app"></main>
</div>

<nav class="tabs" aria-label="Bereiche">
  <div class="inner">
    <button data-tab="overview" aria-current="page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l5-5 4 4 8-8"/><path d="M14 8h6v6"/></svg>Übersicht</button>
    <button data-tab="expenses">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3 10h18"/><path d="M7 15h4"/></svg>Ausgaben</button>
    <button data-tab="savings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10"/><path d="M10 20V4"/><path d="M16 20v-7"/><path d="M22 20H2"/></svg>Sparen</button>
  </div>
</nav>

<script>
(() => {
  const STORE_KEY = "vier-monats-finanzplan-v1";
  const UI_KEY = "vier-monats-finanzplan-ui";
  const MONTHS_DE = ["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];
  const MONTHS_SHORT = ["Jan","Feb","Mär","Apr","Mai","Jun","Jul","Aug","Sep","Okt","Nov","Dez"];
  const HORIZONS = [[6,"6M","6 Monaten"],[12,"1J","1 Jahr"],[36,"3J","3 Jahren"],[120,"10J","10 Jahren"]];
  const $ = id => document.getElementById(id);
  const uid = () => Math.random().toString(36).slice(2, 10);
  const eur2 = new Intl.NumberFormat("de-DE", { style: "currency", currency: "EUR", minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const fmt = n => eur2.format(n || 0);
  const pct = n => (n || 0).toLocaleString("de-DE", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " %";
  const parseNum = s => { const v = parseFloat(String(s).replace(/\s|€/g, "").replace(/\.(?=\d{3}(\D|$))/g, "").replace(",", ".")); return isFinite(v) ? v : 0; };
  const showNum = n => (n ? String(n).replace(".", ",") : "");
  const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const initials = s => (String(s || "?").trim().split(/\s+/).map(w => w[0]).join("").slice(0, 2) || "?").toUpperCase();

  const ym = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
  const addMonths = (key, n) => { const [y, m] = key.split("-").map(Number); return ym(new Date(y, m - 1 + n, 1)); };
  const monthName = key => { const [y, m] = key.split("-").map(Number); return `${MONTHS_DE[m - 1]} ${y}`; };
  const monthShort = key => { const [y, m] = key.split("-").map(Number); return `${MONTHS_SHORT[m - 1]} ${String(y).slice(2)}`; };
  const windowMonths = w => [0, 1, 2, 3].map(i => addMonths(w.start, i));
  const sortedWins = () => [...state.windows].sort((a, b) => a.start.localeCompare(b.start));

  function exampleState() {
    const start = ym(new Date());
    const months = {};
    [0, 1, 2, 3].forEach(i => { months[addMonths(start, i)] = { salary: 2600, extras: [] }; });
    months[addMonths(start, 1)].extras.push({ id: uid(), name: "Geschenke", amount: 150 });
    months[addMonths(start, 2)].extras.push({ id: uid(), name: "Kfz-Versicherung (jährlich)", amount: 420 });
    const w = { id: uid(), start, fixed: [
      { id: uid(), name: "Miete warm", amount: 850 },
      { id: uid(), name: "Strom", amount: 65 },
      { id: uid(), name: "Handy & Internet", amount: 45 },
      { id: uid(), name: "Lebensmittel", amount: 350 },
      { id: uid(), name: "Streaming", amount: 18 },
    ], months };
    return { example: true, active: w.id, windows: [w], etfs: [
      { id: uid(), name: "MSCI World", rate: 200, start: 1500, ret: 4 },
      { id: uid(), name: "MSCI Emerging Markets", rate: 50, start: 300, ret: 4 },
    ] };
  }
  function emptyState() {
    const start = ym(new Date());
    const months = {};
    [0, 1, 2, 3].forEach(i => { months[addMonths(start, i)] = { salary: 0, extras: [] }; });
    const w = { id: uid(), start, fixed: [], months };
    return { example: false, active: w.id, windows: [w], etfs: [] };
  }

  let state = exampleState();
  let ui = { tab: "overview", horizon: 120, month: null };
  try { Object.assign(ui, JSON.parse(localStorage.getItem(UI_KEY) || "{}")); } catch {}
  const saveUi = () => { try { localStorage.setItem(UI_KEY, JSON.stringify(ui)); } catch {} };
  const activeWin = () => state.windows.find(w => w.id === state.active) || state.windows[0];
  const monthData = (w, key) => (w.months[key] ||= { salary: 0, extras: [] });
  const selMonth = () => { const ms = windowMonths(activeWin()); return ms.includes(ui.month) ? ui.month : ms[0]; };

  // ---------- Persistenz ----------
  let saveTarget = null, saveTimer = null, saving = false, dirty = false;
  const saveEl = $("save");
  const setSave = (s, text) => { saveEl.dataset.s = s; saveEl.textContent = text; };
  function localLoad() { try { const r = localStorage.getItem(STORE_KEY); return r ? JSON.parse(r) : null; } catch { return null; } }
  function localSave() { try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); return true; } catch { return false; } }
  function changed() {
    if (state.example) { state.example = false; $("banner").hidden = true; }
    dirty = true;
    setSave("pending", "Speichert …");
    clearTimeout(saveTimer);
    saveTimer = setTimeout(flush, 800);
  }
  async function flush() {
    if (saving) { saveTimer = setTimeout(flush, 400); return; }
    if (!dirty) return;
    dirty = false;
    const ok = localSave();
    if (!saveTarget) { setSave("local", ok ? "Nur in diesem Browser" : "Speichern nicht möglich"); return; }
    saving = true;
    try {
      await saveTarget.set({ plan: JSON.parse(JSON.stringify(state)), savedAt: new Date().toISOString() });
      setSave("ok", "Gespeichert");
    } catch { setSave("local", "Lokal gesichert"); }
    finally { saving = false; }
  }
  async function boot() {
    const local = localLoad();
    if (local && local.windows?.length) state = local;
    render();
    setSave("local", local ? "Nur in diesem Browser" : "Noch nicht gespeichert");
    const c = window.claude;
    if (!c?.use) return;
    try {
      const [db, user] = await Promise.all([c.use("db"), c.use("user")]);
      if (!db || !user) return;
      const id = await user.id();
      if (!id) return;
      const ref = db.collection("data/users/" + id).doc("plan");
      const snap = await ref.get();
      saveTarget = ref;
      if (snap.exists && snap.data()?.plan?.windows?.length) {
        state = snap.data().plan; render(); localSave(); setSave("ok", "Gespeichert");
      } else if (local && local.windows?.length && !local.example) {
        dirty = true; await flush();
      } else setSave("ok", "Speichert automatisch");
    } catch {}
  }

  // ---------- Berechnung ----------
  const sum = arr => arr.reduce((a, x) => a + (+x.amount || 0), 0);
  const etfMonthly = () => state.etfs.reduce((a, e) => a + (+e.rate || 0), 0);
  const etfInvested = () => state.etfs.reduce((a, e) => a + (+e.start || 0), 0);
  function monthCalc(w, key) {
    const m = monthData(w, key);
    const salary = +m.salary || 0, fixed = sum(w.fixed), extras = sum(m.extras), save = etfMonthly();
    return { salary, fixed, extras, save, rest: salary - fixed - extras - save };
  }
  function project(e, months) {
    const r = Math.pow(1 + (+e.ret || 0) / 100, 1 / 12) - 1;
    const rate = +e.rate || 0, start = +e.start || 0, g = Math.pow(1 + r, months);
    return { value: start * g + (r === 0 ? rate * months : rate * (g - 1) / r), paid: start + rate * months };
  }
  const projectAll = months => state.etfs.reduce((a, e) => { const p = project(e, months); a.value += p.value; a.paid += p.paid; return a; }, { value: 0, paid: 0 });

  // ---------- Ansichten ----------
  const TITLES = { overview: "Übersicht", expenses: "Ausgaben", savings: "Sparen" };
  function render() {
    state.active = activeWin().id;
    $("banner").hidden = !state.example;
    document.querySelectorAll("nav.tabs button").forEach(b => {
      if (b.dataset.tab === ui.tab) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current");
    });
    $("pageTitle").textContent = TITLES[ui.tab];
    ({ overview: renderOverview, expenses: renderExpenses, savings: renderSavings })[ui.tab]();
  }

  function windowChips() {
    return `<div class="chips">${sortedWins().map(w => `<button class="chip" data-win="${w.id}" aria-pressed="${w.id === activeWin().id}">${monthShort(w.start)} – ${monthShort(addMonths(w.start, 3))}</button>`).join("")}
      <button class="chip" id="addWin" aria-label="Nächste 4 Monate anlegen">+ 4 Monate</button></div>`;
  }

  function depotHero(idPrefix) {
    const n = ui.horizon, p = projectAll(n), label = HORIZONS.find(h => h[0] === n)[2];
    const gain = p.value - p.paid;
    return `<section class="section">
      <div class="hero">
        <span class="cap" id="${idPrefix}Cap">Depotwert in ${label} (konservativ)</span>
        <span class="big" id="${idPrefix}Big">${fmt(p.value)}</span>
        <span class="delta up" id="${idPrefix}Delta">+${fmt(gain)} (${pct(p.paid ? gain / p.paid * 100 : 0)}) Ertrag</span>
        <span class="muted" style="font-size:.85rem" id="${idPrefix}Paid">davon eingezahlt ${fmt(p.paid)}</span>
      </div>
      <div class="chart" id="${idPrefix}Chart"></div>
      <div class="chips spread">${HORIZONS.map(([m, s]) => `<button class="chip" data-hz="${m}" aria-pressed="${m === n}">${s}</button>`).join("")}</div>
    </section>`;
  }

  function renderOverview() {
    const w = activeWin();
    const ms = windowMonths(w);
    const cur = ms.includes(ym(new Date())) ? ym(new Date()) : ms[0];
    const c = monthCalc(w, cur);
    const total = c.salary || 1;
    const share = v => Math.max(0, Math.min(100, v / total * 100));
    let tot = { salary: 0, out: 0, save: 0, rest: 0 };
    ms.forEach(k => { const x = monthCalc(w, k); tot.salary += x.salary; tot.out += x.fixed + x.extras; tot.save += x.save; tot.rest += x.rest; });

    $("view").innerHTML = `
      ${depotHero("ov")}
      <section class="section">
        <div class="section-head"><h2>${monthName(cur)}</h2><span class="muted" style="font-size:.85rem">Budget</span></div>
        <div class="stats">
          <div class="stat"><span class="k">Gehalt</span><span class="v">${fmt(c.salary)}</span></div>
          <div class="stat"><span class="k">Frei verfügbar</span><span class="v ${c.rest < 0 ? "down" : "up"}">${fmt(c.rest)}</span></div>
          <div class="stat"><span class="k">Ausgaben</span><span class="v">${fmt(c.fixed + c.extras)}</span></div>
          <div class="stat"><span class="k">Sparen (ETFs)</span><span class="v">${fmt(c.save)}</span></div>
        </div>
        <div class="bar" aria-hidden="true">
          <span style="width:${share(c.fixed + c.extras)}%;background:var(--down)"></span>
          <span style="width:${share(c.save)}%;background:var(--ink)"></span>
          <span style="width:${share(Math.max(0, c.rest))}%;background:var(--up)"></span>
        </div>
        <div class="muted" style="font-size:.8rem;display:flex;gap:14px;flex-wrap:wrap">
          <span><span class="down">■</span> Ausgaben ${Math.round(share(c.fixed + c.extras))} %</span>
          <span>■ Sparen ${Math.round(share(c.save))} %</span>
          <span><span class="up">■</span> Frei ${Math.round(share(Math.max(0, c.rest)))} %</span>
        </div>
      </section>
      <section class="section">
        <div class="section-head"><h2>Planungsfenster</h2></div>
        ${windowChips()}
        <div class="list">
          ${ms.map(k => { const x = monthCalc(w, k); return `<button class="item link" data-gomonth="${k}">
            <span class="icon">${MONTHS_SHORT[+k.slice(5) - 1]}</span>
            <span class="grow"><span style="font-weight:700">${monthName(k)}</span><span class="sub">Gehalt ${fmt(x.salary)} · Ausgaben ${fmt(x.fixed + x.extras)}</span></span>
            <span class="val ${x.rest < 0 ? "down" : ""}">${fmt(x.rest)}<br><span class="sub">frei</span></span>
            <span class="chev">›</span></button>`; }).join("")}
        </div>
        <div class="stats">
          <div class="stat"><span class="k">4 Monate frei</span><span class="v ${tot.rest < 0 ? "down" : "up"}">${fmt(tot.rest)}</span></div>
          <div class="stat"><span class="k">4 Monate gespart</span><span class="v">${fmt(tot.save)}</span></div>
        </div>
      </section>
      <section class="section">
        <div class="section-head"><h2>Deine ETFs</h2><button class="chip" data-tab="savings">Bearbeiten</button></div>
        <div class="list">${state.etfs.map(e => { const p = project(e, ui.horizon); return `<div class="item">
          <span class="icon">${esc(initials(e.name))}</span>
          <span class="grow"><span style="font-weight:700">${esc(e.name || "Ohne Namen")}</span><span class="sub">${fmt(e.start)} investiert · ${fmt(e.rate)} / Monat</span></span>
          <span class="val">${fmt(p.value)}<br><span class="sub up">+${fmt(p.value - p.paid)}</span></span></div>`; }).join("") || `<p class="muted" style="margin:0">Noch keine ETFs. Lege sie unter „Sparen“ an.</p>`}</div>
      </section>`;
    drawChart("ov");
  }

  function renderExpenses() {
    const w = activeWin(), key = selMonth();
    ui.month = key;
    const m = monthData(w, key);
    $("view").innerHTML = `
      <section class="section">
        ${windowChips()}
        <div class="chips spread">${windowMonths(w).map(k => `<button class="chip" data-month="${k}" aria-pressed="${k === key}">${MONTHS_SHORT[+k.slice(5) - 1]}</button>`).join("")}</div>
      </section>
      <section class="hero">
        <span class="cap">Frei verfügbar im ${monthName(key)}</span>
        <span class="big" id="exRest"></span>
        <span class="muted" style="font-size:.88rem" id="exBreak"></span>
      </section>
      <section class="section">
        <h2>Einnahmen</h2>
        <div class="card"><div class="field"><label for="salary">Gehalt (netto) im ${MONTHS_DE[+key.slice(5) - 1]}</label>
          <input class="in amt" id="salary" data-salary="${key}" inputmode="decimal" placeholder="0,00" value="${esc(showNum(m.salary))}"><span class="euro">€</span></div></div>
      </section>
      <section class="section">
        <div class="section-head"><h2>Monatliche Ausgaben</h2><span class="muted" style="font-size:.82rem">jeden Monat im Fenster</span></div>
        <div class="card">
          ${w.fixed.map(f => expRow(f, "fixed")).join("")}
          <button class="add" data-add="fixed">Monatliche Ausgabe hinzufügen</button>
        </div>
        <div class="sumrow"><span>Summe pro Monat</span><span id="fixedSum"></span></div>
      </section>
      <section class="section">
        <div class="section-head"><h2>Einmalige Ausgaben</h2><span class="muted" style="font-size:.82rem">nur im ${MONTHS_DE[+key.slice(5) - 1]}</span></div>
        <div class="card">
          ${m.extras.map(x => expRow(x, "extra:" + key)).join("")}
          <button class="add" data-add="extra:${key}">Einmalige Ausgabe hinzufügen</button>
        </div>
        <div class="sumrow"><span>Summe einmalig</span><span id="extraSum"></span></div>
      </section>
      ${state.windows.length > 1 ? `<div class="row-actions" id="delWrap"><button class="btn danger" id="delWin">Planungsfenster ${monthShort(w.start)} – ${monthShort(addMonths(w.start, 3))} löschen</button></div>` : ""}`;
    liveExpenses();
  }
  function expRow(item, scope) {
    return `<div class="erow" data-id="${item.id}" data-scope="${scope}">
      <input class="in name" id="n-${item.id}" aria-label="Bezeichnung" placeholder="Bezeichnung, z. B. Miete" value="${esc(item.name)}" data-field="name">
      <input class="in amt" id="a-${item.id}" aria-label="Betrag in Euro" inputmode="decimal" placeholder="0,00" value="${esc(showNum(item.amount))}" data-field="amount">
      <span class="euro">€</span>
      <button class="x" data-del="${item.id}" data-scope="${scope}" aria-label="Entfernen">×</button></div>`;
  }
  function liveExpenses() {
    const w = activeWin(), key = selMonth(), c = monthCalc(w, key);
    $("exRest").textContent = fmt(c.rest);
    $("exRest").className = "big" + (c.rest < 0 ? " down" : "");
    $("exBreak").textContent = `${fmt(c.salary)} Gehalt − ${fmt(c.fixed)} monatlich − ${fmt(c.extras)} einmalig − ${fmt(c.save)} Sparen`;
    $("fixedSum").textContent = fmt(c.fixed);
    $("extraSum").textContent = fmt(c.extras);
  }

  function renderSavings() {
    $("view").innerHTML = `
      ${depotHero("sv")}
      <section class="stats">
        <div class="stat"><span class="k">Bereits investiert</span><span class="v" id="svInv"></span></div>
        <div class="stat"><span class="k">Monatliche Sparrate</span><span class="v" id="svRate"></span></div>
      </section>
      <section class="section">
        <h2>Meine ETFs</h2>
        ${state.etfs.map(e => `<div class="etf" data-etf="${e.id}">
          <div class="etf-head"><span class="icon" id="ic-${e.id}">${esc(initials(e.name))}</span>
            <input class="in" id="en-${e.id}" aria-label="Name des ETFs" placeholder="Name des ETFs, z. B. MSCI World" value="${esc(e.name)}" data-efield="name">
            <button class="x" data-deletf="${e.id}" aria-label="ETF entfernen">×</button></div>
          <div class="field"><label for="es-${e.id}">Bereits im ETF investiert</label><input class="in amt" id="es-${e.id}" inputmode="decimal" placeholder="0,00" value="${esc(showNum(e.start))}" data-efield="start"><span class="euro">€</span></div>
          <div class="field"><label for="er-${e.id}">Monatliche Sparrate</label><input class="in amt" id="er-${e.id}" inputmode="decimal" placeholder="0,00" value="${esc(showNum(e.rate))}" data-efield="rate"><span class="euro">€</span></div>
          <div class="field"><label for="et-${e.id}">Erwartete Rendite pro Jahr (konservativ)</label><input class="in amt" id="et-${e.id}" inputmode="decimal" placeholder="4" value="${esc(showNum(e.ret))}" data-efield="ret"><span class="euro">%</span></div>
        </div>`).join("") || `<p class="muted" style="margin:0">Noch kein ETF angelegt.</p>`}
        <div class="card"><button class="add" id="addEtf">ETF hinzufügen</button></div>
      </section>
      <section class="section">
        <h2>Hochrechnung pro ETF</h2>
        <div class="tbl" id="svTable"></div>
        <p class="note">Rechnung: Sparrate am Monatsende, Zinseszins mit der eingetragenen Jahresrendite. Konservativ heißt: 4 % p.a. als Standard statt der historisch eher 6–8 % breiter Aktien-ETFs. Steuern, Inflation und Kursschwankungen sind nicht berücksichtigt. Planungshilfe, keine Garantie.</p>
      </section>`;
    liveSavings();
  }
  function liveSavings() {
    $("svInv").textContent = fmt(etfInvested());
    $("svRate").textContent = fmt(etfMonthly());
    $("svTable").innerHTML = state.etfs.length ? `<table><thead><tr><th>ETF</th>${HORIZONS.map(h => `<th>${h[1]}</th>`).join("")}</tr></thead><tbody>
      ${state.etfs.map(e => `<tr><td>${esc(e.name || "Ohne Namen")}</td>${HORIZONS.map(([n]) => `<td>${fmt(project(e, n).value)}</td>`).join("")}</tr>`).join("")}
      <tr><td><strong>Gesamt</strong></td>${HORIZONS.map(([n]) => `<td><strong>${fmt(projectAll(n).value)}</strong></td>`).join("")}</tr></tbody></table>` : "";
    state.etfs.forEach(e => { const ic = $("ic-" + e.id); if (ic) ic.textContent = initials(e.name); });
    updateHero("sv");
    drawChart("sv");
  }

  function updateHero(p, n = ui.horizon, label) {
    const r = projectAll(n), gain = r.value - r.paid;
    if (!$(p + "Big")) return;
    $(p + "Cap").textContent = label || `Depotwert in ${HORIZONS.find(h => h[0] === ui.horizon)[2]} (konservativ)`;
    $(p + "Big").textContent = fmt(r.value);
    $(p + "Delta").textContent = `+${fmt(gain)} (${pct(r.paid ? gain / r.paid * 100 : 0)}) Ertrag`;
    $(p + "Paid").textContent = `davon eingezahlt ${fmt(r.paid)}`;
  }

  function drawChart(p) {
    const box = $(p + "Chart"); if (!box) return;
    const N = ui.horizon, W = 600, H = 220, T = 12, B = 12;
    const pts = []; for (let n = 0; n <= N; n++) pts.push(projectAll(n));
    const max = Math.max(1, ...pts.map(q => q.value)), min = Math.min(...pts.map(q => q.paid), pts[0].value);
    const lo = Math.max(0, min - (max - min) * 0.1);
    const x = n => (n / N) * W;
    const y = v => T + (1 - (v - lo) / ((max - lo) || 1)) * (H - T - B);
    const path = k => pts.map((q, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(q[k]).toFixed(1)}`).join("");
    box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Depotentwicklung über ${N} Monate">
      <defs><linearGradient id="g-${p}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--up)" stop-opacity=".28"/><stop offset="1" stop-color="var(--up)" stop-opacity="0"/></linearGradient></defs>
      <path d="${path("value")}L${W},${H}L0,${H}Z" fill="url(#g-${p})"/>
      <path d="${path("paid")}" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="3 5"/>
      <path d="${path("value")}" fill="none" stroke="var(--up)" stroke-width="2.5" stroke-linejoin="round"/>
      <line id="${p}Cur" x1="0" x2="0" y1="0" y2="${H}" stroke="var(--muted)" stroke-width="1" visibility="hidden"/>
      <circle id="${p}Dot" r="5" cx="${W}" cy="${y(pts[N].value)}" fill="var(--up)" stroke="var(--bg)" stroke-width="2"/>
    </svg>
    <div class="muted" style="font-size:.75rem;display:flex;justify-content:space-between;padding-inline:4px"><span>heute</span><span>gestrichelt: nur Einzahlungen</span><span>${monthShort(addMonths(ym(new Date()), N))}</span></div>`;
    const svg = box.querySelector("svg");
    const move = ev => {
      const r = svg.getBoundingClientRect();
      const n = Math.round(Math.max(0, Math.min(1, (ev.clientX - r.left) / r.width)) * N);
      const cur = $(p + "Cur"), dot = $(p + "Dot");
      cur.setAttribute("x1", x(n)); cur.setAttribute("x2", x(n)); cur.setAttribute("visibility", "visible");
      dot.setAttribute("cx", x(n)); dot.setAttribute("cy", y(pts[n].value));
      updateHero(p, n, n === 0 ? "Depotwert heute" : `Depotwert ${monthName(addMonths(ym(new Date()), n))}`);
    };
    const leave = () => {
      $(p + "Cur").setAttribute("visibility", "hidden");
      $(p + "Dot").setAttribute("cx", W); $(p + "Dot").setAttribute("cy", y(pts[N].value));
      updateHero(p);
    };
    svg.addEventListener("pointermove", move);
    svg.addEventListener("pointerdown", move);
    svg.addEventListener("pointerleave", leave);
    svg.addEventListener("pointerup", ev => { if (ev.pointerType !== "mouse") leave(); });
  }

  // ---------- Interaktion ----------
  function findList(scope) {
    const w = activeWin();
    if (scope === "fixed") return w.fixed;
    if (scope.startsWith("extra:")) return monthData(w, scope.slice(6)).extras;
    return null;
  }
  const focusLater = id => requestAnimationFrame(() => $(id)?.focus());
  const go = tab => { ui.tab = tab; saveUi(); render(); window.scrollTo(0, 0); };

  document.addEventListener("input", e => {
    const t = e.target;
    if (t.dataset.salary) monthData(activeWin(), t.dataset.salary).salary = parseNum(t.value);
    else if (t.dataset.field) {
      const row = t.closest(".erow"), item = findList(row.dataset.scope)?.find(i => i.id === row.dataset.id);
      if (!item) return;
      item[t.dataset.field] = t.dataset.field === "amount" ? parseNum(t.value) : t.value;
    } else if (t.dataset.efield) {
      const et = state.etfs.find(x => x.id === t.closest(".etf").dataset.etf); if (!et) return;
      et[t.dataset.efield] = t.dataset.efield === "name" ? t.value : parseNum(t.value);
    } else return;
    if (ui.tab === "expenses") liveExpenses(); else if (ui.tab === "savings") liveSavings();
    changed();
  });

  document.addEventListener("click", e => {
    const t = e.target.closest("button"); if (!t) return;
    if (t.dataset.tab) return go(t.dataset.tab);
    if (t.dataset.hz) { ui.horizon = +t.dataset.hz; saveUi(); render(); return; }
    if (t.dataset.win) { state.active = t.dataset.win; ui.month = null; render(); changed(); return; }
    if (t.dataset.month) { ui.month = t.dataset.month; saveUi(); render(); return; }
    if (t.dataset.gomonth) { ui.month = t.dataset.gomonth; return go("expenses"); }
    if (t.dataset.add) { const item = { id: uid(), name: "", amount: 0 }; findList(t.dataset.add).push(item); render(); focusLater("n-" + item.id); changed(); return; }
    if (t.dataset.del) { const list = findList(t.dataset.scope), i = list.findIndex(x => x.id === t.dataset.del); if (i >= 0) list.splice(i, 1); render(); changed(); return; }
    if (t.dataset.deletf) { state.etfs = state.etfs.filter(x => x.id !== t.dataset.deletf); render(); changed(); return; }
    switch (t.id) {
      case "addEtf": { const item = { id: uid(), name: "", rate: 0, start: 0, ret: 4 }; state.etfs.push(item); render(); focusLater("en-" + item.id); changed(); break; }
      case "addWin": {
        const last = sortedWins().at(-1), start = addMonths(last.start, 4);
        const lastSalary = monthData(last, addMonths(last.start, 3)).salary, months = {};
        [0, 1, 2, 3].forEach(i => { months[addMonths(start, i)] = { salary: lastSalary, extras: [] }; });
        const w = { id: uid(), start, fixed: last.fixed.map(f => ({ ...f, id: uid() })), months };
        state.windows.push(w); state.active = w.id; ui.month = null; render(); changed(); break;
      }
      case "delWin": $("delWrap").innerHTML = `<span>Wirklich löschen?</span><button class="btn danger" id="delYes">Löschen</button><button class="btn soft" id="delNo">Abbrechen</button>`; break;
      case "delNo": render(); break;
      case "delYes": state.windows = state.windows.filter(x => x.id !== activeWin().id); state.active = sortedWins()[0].id; ui.month = null; render(); changed(); break;
      case "clearExample": state = emptyState(); render(); changed(); break;
    }
  });

  window.addEventListener("beforeunload", () => { if (dirty) localSave(); });
  boot();
})();
</script>
