<title>Vier-Monats-Finanzplan</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: schmale App-Spalte wie eine Banking-App, große Zahl oben, Listen darunter, Tab-Leiste unten fixiert */
:root {
  --bg: #000000;
  --surface: #121212;
  --surface-2: #1c1c1e;
  --ink: #ffffff;
  --muted: #8d8d93;
  --line: #262628;
  --up: #2ed47a;
  --down: #ff5a4e;
  --chip: #2a2a2d;
  --font: "Manrope", "Segoe UI", system-ui, -apple-system, sans-serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #ffffff; --surface: #f4f4f5; --surface-2: #ebebed; --ink: #0a0a0a; --muted: #6e6e73;
    --line: #e6e6e8; --up: #14a356; --down: #e0362b; --chip: #ececee; color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #ffffff; --surface: #f4f4f5; --surface-2: #ebebed; --ink: #0a0a0a; --muted: #6e6e73;
  --line: #e6e6e8; --up: #14a356; --down: #e0362b; --chip: #ececee; color-scheme: light;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.4;
  font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px calc(96px + env(safe-area-inset-bottom, 0px));
}
.app { max-width: 560px; margin: 0 auto; display: grid; gap: 28px; }
h1, h2 { margin: 0; text-wrap: balance; }
h2 { font-size: 1.25rem; font-weight: 700; letter-spacing: -0.01em; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.muted { color: var(--muted); }
.up { color: var(--up); } .down { color: var(--down); }

/* Kopf */
.topbar { display: flex; justify-content: space-between; align-items: center; min-height: 36px; gap: 12px; }
.topbar .title { font-weight: 700; font-size: 1rem; }
.save { font-size: 0.78rem; color: var(--muted); display: flex; gap: 6px; align-items: center; }
.save::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--up); }
.save[data-s="pending"]::before { background: var(--muted); }
.save[data-s="local"]::before { background: var(--muted); }

/* Große Zahl */
.hero { display: grid; gap: 4px; }
.hero .cap { color: var(--muted); font-size: 0.95rem; font-weight: 500; }
.hero .big { font-size: clamp(2.3rem, 9vw, 3rem); font-weight: 800; letter-spacing: -0.03em; line-height: 1.05; }
.hero .delta { font-weight: 600; font-size: 0.98rem; }

/* Chart */
.chart { position: relative; margin-inline: -4px; touch-action: pan-y; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 0; background: transparent; color: var(--muted); padding: 7px 13px; border-radius: 999px; font-weight: 700; font-size: 0.85rem; }
.chip[aria-pressed="true"] { background: var(--chip); color: var(--ink); }
.chips.spread { justify-content: space-between; }

/* Listen */
.section { display: grid; gap: 10px; }
.section-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.list { display: grid; }
.item { display: flex; align-items: center; gap: 12px; padding: 13px 0; border-bottom: 1px solid var(--line); min-width: 0; }
.item:last-child { border-bottom: 0; }
.item .grow { flex: 1 1 auto; min-width: 0; display: grid; gap: 2px; }
.item .sub { font-size: 0.82rem; color: var(--muted); }
.item .val { font-weight: 700; text-align: right; white-space: nowrap; }
.item .val .sub { font-weight: 500; }
.icon { width: 40px; height: 40px; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; font-weight: 800; font-size: 0.85rem; flex: none; color: var(--ink); }
.item.link { background: none; border-left: 0; border-right: 0; border-top: 0; width: 100%; text-align: left; }
.chev { color: var(--muted); font-size: 1.2rem; }

.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.stat { background: var(--surface); border-radius: 16px; padding: 14px 16px; display: grid; gap: 4px; min-width: 0; }
.stat .k { font-size: 0.82rem; color: var(--muted); font-weight: 500; }
.stat .v { font-size: 1.25rem; font-weight: 800; letter-spacing: -0.02em; }
.bar { height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; display: flex; }
.bar span { display: block; height: 100%; }

/* Eingaben */
.card { background: var(--surface); border-radius: 16px; padding: 4px 16px; }
.field { display: flex; align-items: center; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.field:last-child { border-bottom: 0; }
.field label, .field .lbl { flex: 1 1 auto; color: var(--muted); font-size: 0.92rem; font-weight: 500; }
input.in {
  font: inherit; color: var(--ink); background: transparent; border: 0; padding: 4px 0; min-width: 0; width: 100%;
  font-weight: 600;
}
input.in::placeholder { color: var(--muted); font-weight: 500; }
input.amt { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
.field input.amt { flex: 0 0 7rem; width: 7rem; }
.euro { color: var(--muted); font-weight: 600; }
.erow { display: flex; align-items: center; gap: 8px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.erow:last-of-type { border-bottom: 0; }
.erow .in.name { flex: 1 1 auto; }
.erow .in.amt { flex: 0 0 6.5rem; width: 6.5rem; }
.x { border: 0; background: transparent; color: var(--muted); width: 30px; height: 30px; border-radius: 50%; font-size: 1.15rem; flex: none; }
.x:hover { background: var(--surface-2); color: var(--down); }
.add { border: 0; background: transparent; color: var(--ink); font-weight: 700; padding: 12px 0; text-align: left; width: 100%; display: flex; gap: 10px; align-items: center; }
.add::before { content: "+"; width: 26px; height: 26px; border-radius: 50%; background: var(--chip); display: grid; place-items: center; font-size: 1.05rem; }
.sumrow { display: flex; justify-content: space-between; font-weight: 700; padding: 4px 2px 0; }
.btn { border: 0; background: var(--ink); color: var(--bg); border-radius: 999px; padding: 11px 18px; font-weight: 700; }
.btn.soft { background: var(--chip); color: var(--ink); }
.btn.danger { background: transparent; color: var(--down); padding-inline: 0; }
.row-actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

.etf { background: var(--surface); border-radius: 16px; padding: 14px 16px 6px; display: grid; gap: 2px; }
.etf-head { display: flex; align-items: center; gap: 12px; padding-bottom: 6px; }
.etf-head .in { font-size: 1.05rem; font-weight: 700; }

.banner { background: var(--surface); border-radius: 16px; padding: 14px 16px; display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; font-size: 0.92rem; }
.note { font-size: 0.8rem; color: var(--muted); margin: 0; max-width: 62ch; }
table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
th, td { padding: 9px 6px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; padding-left: 0; }
th { color: var(--muted); font-weight: 600; font-size: 0.78rem; }
.tbl { overflow-x: auto; }

/* Tab-Leiste */
nav.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--bg); border-top: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: 8px; padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px));
}
.gear { border: 0; background: var(--chip); color: var(--ink); width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; }
textarea.in { font: inherit; font-size: 0.8rem; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px; width: 100%; min-height: 110px; resize: vertical; font-family: ui-monospace, Menlo, monospace; }
.ok-msg { color: var(--up); font-weight: 600; font-size: 0.9rem; margin: 0; }
.err-msg { color: var(--down); font-weight: 600; font-size: 0.9rem; margin: 0; }
nav.tabs .inner { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); }
.goal { background: var(--surface); border-radius: 20px; padding: 14px; display: grid; gap: 12px; }
.goal-art { aspect-ratio: 16 / 10; max-width: 100%; border-radius: 14px; overflow: hidden; display: grid; place-items: center;
  background: radial-gradient(120% 90% at 50% 20%, var(--surface-2), var(--bg)); }
.goal-art svg { width: 78%; height: auto; overflow: visible; }
.goal-art .a-photo { width: 100%; height: 100%; object-fit: cover; }
.goal-art { position: relative; }
.goal-art * { animation: none !important; }
.goal-art .a-shine { display: none; }
.credit { position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 10px 6px; font-size: 0.66rem; line-height: 1.3; color: #fff;
  background: linear-gradient(transparent, rgba(0,0,0,.65)); overflow-wrap: anywhere; }
.credit a { color: #fff; }
.pick-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.pick { border: 2px solid transparent; padding: 0; background: var(--surface-2); border-radius: 10px; overflow: hidden; aspect-ratio: 1; }
.pick img { width: 100%; height: 100%; object-fit: cover; display: block; }
.pick[aria-pressed="true"] { border-color: var(--up); }
.urlrow { display: flex; gap: 8px; }
.urlrow input { flex: 1 1 auto; background: var(--surface-2); border-radius: 999px; padding: 10px 14px; font-weight: 500; }
.goal-head { display: flex; gap: 10px; align-items: center; }
.goal-head .grow { display: grid; gap: 2px; min-width: 0; }
.g-title { font-size: 1.2rem; font-weight: 800; letter-spacing: -0.01em; overflow-wrap: anywhere; }
.goal-head .sub { font-size: 0.82rem; color: var(--muted); }
.g-bar { position: relative; height: 26px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.g-fill { position: absolute; inset: 0 auto 0 0; width: var(--w); background: linear-gradient(90deg, color-mix(in srgb, var(--up) 70%, transparent), var(--up)); border-radius: 999px; }
.g-fill.done { background: var(--up); }
.g-pct { position: absolute; inset: 0; display: grid; place-items: center; font-weight: 800; font-size: 0.82rem; color: var(--ink); text-shadow: 0 0 6px var(--bg); }
.g-nums { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-size: 0.92rem; }
.g-when { margin: 0; font-size: 0.95rem; }
.goal-edit { display: grid; gap: 10px; border-top: 1px solid var(--line); padding-top: 12px; }
.goal-edit .card { background: var(--surface-2); }
.label-s { font-size: 0.82rem; color: var(--muted); font-weight: 600; }
select.in.sel { flex: 0 0 auto; width: auto; text-align: right; font-weight: 700; appearance: none; }
.btn[disabled] { opacity: .45; cursor: default; }
.a-sec { transform-origin: 100px 62px; transform-box: view-box; animation: a-spin 60s linear infinite; }
.a-subsec { transform-box: view-box; animation: a-spin 60s linear infinite; }
.a-float { animation: a-float 5s ease-in-out infinite; }
.a-shine { animation: a-shine 4.5s ease-in-out infinite; }
.a-wheel { transform-box: view-box; animation: a-spin .7s linear infinite; }
.a-road { animation: a-road .5s linear infinite; }
.a-bob { animation: a-bob .9s ease-in-out infinite; }
.a-glow { animation: a-glow 3s ease-in-out infinite; }
.a-smoke { transform-box: view-box; animation: a-smoke 3.3s ease-out infinite; opacity: 0; }
.a-sway { transform-box: view-box; animation: a-sway 4s ease-in-out infinite; }
.a-cloud { animation: a-cloud 12s linear infinite; }
.a-fly { animation: a-fly 3.2s ease-in-out infinite; transform-box: view-box; transform-origin: 115px 66px; }
.a-bar { transform-box: view-box; animation: a-barg 2.4s ease-in-out infinite; }
.a-coin { animation: a-coin 2.2s ease-in infinite; }
.a-photo { animation: a-ken 14s ease-in-out infinite alternate; }
.g-fill { animation: g-grow 1.1s cubic-bezier(.2,.8,.2,1); }
@keyframes a-spin { to { transform: rotate(360deg); } }
@keyframes a-float { 50% { transform: translateY(-3px); } }
@keyframes a-shine { 0%, 60% { transform: translateX(-30px) rotate(35deg); opacity: 0; } 75% { opacity: .18; } 100% { transform: translateX(70px) rotate(35deg); opacity: 0; } }
@keyframes a-road { to { transform: translateX(-28px); } }
@keyframes a-bob { 50% { transform: translateY(-1.5px); } }
@keyframes a-glow { 50% { opacity: .55; } }
@keyframes a-smoke { 0% { transform: translate(0, 0) scale(.6); opacity: 0; } 20% { opacity: .45; } 100% { transform: translate(14px, -26px) scale(1.8); opacity: 0; } }
@keyframes a-sway { 0%, 100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }
@keyframes a-cloud { from { transform: translateX(60px); } to { transform: translateX(-80px); } }
@keyframes a-fly { 0%, 100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-6px) rotate(1deg); } }
@keyframes a-barg { 0%, 100% { transform: scaleY(.55); } 50% { transform: scaleY(1); } }
@keyframes a-coin { 0% { transform: translateY(-10px); opacity: 0; } 15% { opacity: 1; } 70% { transform: translateY(26px); opacity: 1; } 85%, 100% { transform: translateY(30px); opacity: 0; } }
@keyframes a-ken { from { transform: scale(1); } to { transform: scale(1.08) translate(-1%, -1%); } }
@keyframes g-grow { from { width: 0; } }
@media (prefers-reduced-motion: reduce) { .goal-art *, .g-fill { animation: none !important; } }
.lvl { display: inline-block; font-size: 0.72rem; font-weight: 700; border-radius: 999px; padding: 2px 8px; background: var(--chip); color: var(--muted); }
.lvl.unnoetig { background: color-mix(in srgb, var(--down) 18%, transparent); color: var(--down); }
.lvl.vermeidbar { background: var(--chip); color: var(--ink); }
.lvl.noetig { background: color-mix(in srgb, var(--up) 16%, transparent); color: var(--up); }
.seg.small button[data-level="unnoetig"][aria-pressed="true"] { background: var(--down); color: #fff; }
.seg.small button[data-level="noetig"][aria-pressed="true"] { background: var(--up); color: #000; }
.erow.extra { flex-wrap: wrap; }
.erow.extra .seg { flex-basis: 100%; }
.erow.extra .in.name { flex: 1 1 0; width: auto; }
[hidden] { display: none !important; }
.meter { height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
.meter span { display: block; height: 100%; background: var(--ink); border-radius: 3px; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; background: var(--surface); border-radius: 999px; padding: 4px; }
.seg button { border: 0; background: transparent; color: var(--muted); border-radius: 999px; padding: 9px 6px; font-weight: 700; font-size: 0.86rem; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.seg.small { display: inline-grid; padding: 3px; }
.seg.small button { padding: 5px 9px; font-size: 0.74rem; }
.hint { font-size: 0.86rem; color: var(--muted); margin: 0; }
nav.tabs button { border: 0; background: transparent; color: var(--muted); display: grid; justify-items: center; gap: 3px; padding: 4px 0; font-size: 0.74rem; font-weight: 700; }
nav.tabs button svg { width: 24px; height: 24px; }
nav.tabs button[aria-current="page"] { color: var(--ink); }
@media (prefers-reduced-motion: no-preference) { .chip, nav.tabs button { transition: background .15s, color .15s; } }
</style>

<div class="app">
  <div class="topbar">
    <span class="title" id="pageTitle">Übersicht</span>
    <span style="display:flex;align-items:center;gap:8px">
      <span class="save" id="save" data-s="local">Wird geladen …</span>
      <button class="gear" data-tab="data" aria-label="Daten und Backup">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 20h16"/></svg>
      </button>
    </span>
  </div>
  <div class="banner" id="banner" hidden>
    <span><strong>Beispielwerte.</strong> Ersetze sie durch deine Zahlen.</span>
    <button class="btn soft" id="clearExample">Leer starten</button>
  </div>
  <main id="view" class="app"></main>
</div>

<nav class="tabs" aria-label="Bereiche">
  <div class="inner">
    <button data-tab="overview" aria-current="page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l5-5 4 4 8-8"/><path d="M14 8h6v6"/></svg>Übersicht</button>
    <button data-tab="expenses">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3 10h18"/><path d="M7 15h4"/></svg>Ausgaben</button>
    <button data-tab="savings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10"/><path d="M10 20V4"/><path d="M16 20v-7"/><path d="M22 20H2"/></svg>Sparen</button>
    <button data-tab="goals">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg>Ziele</button>
    <button data-tab="analysis">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/><path d="M8 11h6"/></svg>Analyse</button>
  </div>
</nav>

<script>
(() => {
  const STORE_KEY = "vier-monats-finanzplan-v1";
  const UI_KEY = "vier-monats-finanzplan-ui";
  const MONTHS_DE = ["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];
  const MONTHS_SHORT = ["Jan","Feb","Mär","Apr","Mai","Jun","Jul","Aug","Sep","Okt","Nov","Dez"];
  const HORIZONS = [[6,"6M","6 Monaten"],[12,"1J","1 Jahr"],[36,"3J","3 Jahren"],[120,"10J","10 Jahren"]];
  const $ = id => document.getElementById(id);
  const uid = () => Math.random().toString(36).slice(2, 10);
  const eur2 = new Intl.NumberFormat("de-DE", { style: "currency", currency: "EUR", minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const fmt = n => eur2.format(n || 0);
  const pct = n => (n || 0).toLocaleString("de-DE", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " %";
  const parseNum = s => { const v = parseFloat(String(s).replace(/\s|€/g, "").replace(/\.(?=\d{3}(\D|$))/g, "").replace(",", ".")); return isFinite(v) ? v : 0; };
  const showNum = n => (n ? String(n).replace(".", ",") : "");
  const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const initials = s => (String(s || "?").trim().split(/\s+/).map(w => w[0]).join("").slice(0, 2) || "?").toUpperCase();

  const ym = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
  const addMonths = (key, n) => { const [y, m] = key.split("-").map(Number); return ym(new Date(y, m - 1 + n, 1)); };
  const monthName = key => { const [y, m] = key.split("-").map(Number); return `${MONTHS_DE[m - 1]} ${y}`; };
  const monthShort = key => { const [y, m] = key.split("-").map(Number); return `${MONTHS_SHORT[m - 1]} ${String(y).slice(2)}`; };
  const windowMonths = w => [0, 1, 2, 3].map(i => addMonths(w.start, i));
  const sortedWins = () => [...state.windows].sort((a, b) => a.start.localeCompare(b.start));

  function exampleState() {
    const start = ym(new Date());
    const months = {};
    [0, 1, 2, 3].forEach(i => { months[addMonths(start, i)] = { salary: 2600, extras: [] }; });
    months[addMonths(start, 1)].extras.push({ id: uid(), name: "Geschenke", amount: 150 });
    months[addMonths(start, 2)].extras.push({ id: uid(), name: "Kfz-Versicherung (jährlich)", amount: 420 });
    [0, 1, 2, 3].forEach(i => months[addMonths(start, i)].extras.push({ id: uid(), name: "Essen bestellen", amount: [38, 52, 45, 60][i] }));
    months[addMonths(start, 0)].extras.push({ id: uid(), name: "Kleidung", amount: 90 });
    months[addMonths(start, 3)].extras.push({ id: uid(), name: "Kleidung", amount: 120 });
    months[addMonths(start, 1)].extras.push({ id: uid(), name: "Konzert", amount: 75 });
    const w = { id: uid(), start, fixed: [
      { id: uid(), name: "Miete warm", amount: 850 },
      { id: uid(), name: "Strom", amount: 65 },
      { id: uid(), name: "Handy & Internet", amount: 45 },
      { id: uid(), name: "Lebensmittel", amount: 350 },
      { id: uid(), name: "Streaming", amount: 18 },
    ], months };
    return { example: true, active: w.id, windows: [w], etfs: [
      { id: uid(), name: "MSCI World", rate: 200, start: 1500, ret: 4 },

  // Echte Fotos: eigenes Foto, frei lizenziertes Foto von Wikimedia Commons oder ein Bild-Link
  const WEB_PHOTOS = !window.claude?.use; // im Claude-Viewer sind fremde Bilder gesperrt
  const artHtml = g => {
    if (g.photo) return `<img class="a-photo" src="${esc(g.photo)}" alt="${esc(g.name || "Sparziel")}">`;
    if (g.web?.url && WEB_PHOTOS) return `<img class="a-photo" src="${esc(g.web.url)}" alt="${esc(g.name || "Sparziel")}" referrerpolicy="no-referrer">`
      + (g.web.credit || g.web.license ? `<span class="credit">Foto: ${esc(g.web.credit || "unbekannt")}${g.web.license ? ` · ${esc(g.web.license)}` : ""}${g.web.page ? ` · <a href="${esc(g.web.page)}" target="_blank" rel="noopener">Quelle</a>` : ""}</span>` : "");
    return goalArt(g.cat || guessCat(g.name), g);
  };
  const photoCache = new Map();
  const stripHtml = h => { const d = document.createElement("div"); d.innerHTML = h || ""; return (d.textContent || "").replace(/\s+/g, " ").trim(); };
  async function searchPhotos(q) {
    q = q.trim();
    if (photoCache.has(q)) return photoCache.get(q);
    const url = "https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrnamespace=6&gsrlimit=18"
      + "&gsrsearch=" + encodeURIComponent(q + " filetype:bitmap") + "&prop=imageinfo&iiprop=url|size|extmetadata&iiurlwidth=720";
    const res = await fetch(url);
    if (!res.ok) throw new Error("search");
    const data = await res.json();
    const list = Object.values(data.query?.pages || {}).sort((a, b) => a.index - b.index).map(p => {
      const ii = p.imageinfo?.[0] || {}, md = ii.extmetadata || {};
      return { url: ii.thumburl || ii.url, page: ii.descriptionurl, w: ii.width, h: ii.height,
        credit: stripHtml(md.Artist?.value).slice(0, 80), license: stripHtml(md.LicenseShortName?.value) };
    }).filter(x => x.url && x.w >= 300 && x.h >= 200);

  function goalProgress(g) {

  function loadPhoto(file, g) {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const s = Math.min(1, 480 / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      g.photo = c.toDataURL("image/jpeg", 0.75); g.web = null; g.noWeb = false;
      URL.revokeObjectURL(url); render(); changed();

  }

  // Monat für Monat: Einzahlung am Monatsende, geplante Reduzierungen/Pausen werden berücksichtigt
  function project(e, months, idx = monthIndex()) {
    const r = Math.pow(1 + (+e.ret || 0) / 100, 1 / 12) - 1, now = ym(new Date());
    let value = +e.start || 0, paid = value;
    for (let n = 1; n <= months; n++) {
      const c = etfRateIn(idx.get(addMonths(now, n - 1)), e);
      value = value * (1 + r) + c; paid += c;
    }
    return { value, paid };
  }
  const projectAll = months => { const idx = monthIndex(); return state.etfs.reduce((a, e) => { const p = project(e, months, idx); a.value += p.value; a.paid += p.paid; return a; }, { value: 0, paid: 0 }); };
  function projectSeries(N) {
    const idx = monthIndex(), now = ym(new Date());
    const st = state.etfs.map(e => ({ e, r: Math.pow(1 + (+e.ret || 0) / 100, 1 / 12) - 1, v: +e.start || 0 }));
    let paid = st.reduce((a, x) => a + x.v, 0);
    const out = [{ value: paid, paid }];
    for (let n = 1; n <= N; n++) {
      const m = idx.get(addMonths(now, n - 1));
      let value = 0;
      st.forEach(x => { const c = etfRateIn(m, x.e); x.v = x.v * (1 + x.r) + c; paid += c; value += x.v; });
      out.push({ value, paid });
    }
    return out;
  }

  const AVOID_LEVELS = { unnoetig: { label: "Unnötig", f: 1 }, vermeidbar: { label: "Vermeidbar", f: 0.5 }, noetig: { label: "Nötig", f: 0 } };
  const normName = s => String(s || "").toLowerCase().replace(/\(.*?\)/g, "").replace(/\s+/g, " ").trim();

  function analyzeExtras() {
    const groups = new Map(); let total = 0, count = 0; const months = new Set();
    sortedWins().forEach(w => windowMonths(w).forEach(k => {
      const m = w.months[k]; if (!m) return; months.add(k);
      m.extras.forEach(x => {
        const amt = +x.amount || 0; if (!amt && !x.name) return;
        const key = normName(x.name) || "ohne namen";
        const g = groups.get(key) || { key, name: (x.name || "Ohne Namen").replace(/\s*\(.*?\)/g, "").trim() || "Ohne Namen", count: 0, total: 0, months: new Set(), cat: categorize(x.name) };
        g.count++; g.total += amt; g.months.add(k); groups.set(key, g); total += amt; count++;
      });
    }));
    const list = [...groups.values()].map(g => {
      const level = AVOID_LEVELS[state.avoid?.[g.key]] ? state.avoid[g.key] : null;
      return { ...g, level, avoidable: level ? g.total * AVOID_LEVELS[level].f : 0 };

    const perMonth = avoidTotal / a.months;
    const r = Math.pow(1.04, 1 / 12) - 1, fv = n => perMonth * (Math.pow(1 + r, n) - 1) / r;
    const cats = new Map(); a.list.forEach(g => cats.set(g.cat.name, (cats.get(g.cat.name) || 0) + g.total));
    const catList = [...cats].sort((x, y) => y[1] - x[1]);

        <span style="font-size:1.35rem;font-weight:800" class="up">+${fmt(fv(120))} in 10 Jahren</span>
        <span class="muted" style="font-size:.85rem">${fmt(fv(12))} nach 1 Jahr · ${fmt(fv(36))} nach 3 Jahren · Unnötig zählt voll, Vermeidbar zur Hälfte</span></div>` : ""}

  // ---------- Daten & Backup ----------
  const exportJson = () => JSON.stringify({ app: "vier-monats-finanzplan", version: 1, exportedAt: new Date().toISOString(), plan: state });

  function updateHero(p, n = ui.horizon, label) {
    const r = projectAll(n), gain = r.value - r.paid;
    if (!$(p + "Big")) return;
    $(p + "Cap").textContent = label || `Depotwert in ${HORIZONS.find(h => h[0] === ui.horizon)[2]} (konservativ)`;
    $(p + "Big").textContent = fmt(r.value);
    $(p + "Delta").textContent = `+${fmt(gain)} (${pct(r.paid ? gain / r.paid * 100 : 0)}) Ertrag`;
    $(p + "Paid").textContent = `davon eingezahlt ${fmt(r.paid)}`;
  }

  function drawChart(p) {
    const box = $(p + "Chart"); if (!box) return;
    const N = ui.horizon, W = 600, H = 220, T = 12, B = 12;
    const pts = projectSeries(N);
    const max = Math.max(1, ...pts.map(q => q.value)), min = Math.min(...pts.map(q => q.paid), pts[0].value);
    const lo = Math.max(0, min - (max - min) * 0.1);
    const x = n => (n / N) * W;
    const y = v => T + (1 - (v - lo) / ((max - lo) || 1)) * (H - T - B);
    const path = k => pts.map((q, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(q[k]).toFixed(1)}`).join("");
    box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Depotentwicklung über ${N} Monate">
      <defs><linearGradient id="g-${p}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--up)" stop-opacity=".28"/><stop offset="1" stop-color="var(--up)" stop-opacity="0"/></linearGradient></defs>
      <path d="${path("value")}L${W},${H}L0,${H}Z" fill="url(#g-${p})"/>
      <path d="${path("paid")}" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="3 5"/>
      <path d="${path("value")}" fill="none" stroke="var(--up)" stroke-width="2.5" stroke-linejoin="round"/>
      <line id="${p}Cur" x1="0" x2="0" y1="0" y2="${H}" stroke="var(--muted)" stroke-width="1" visibility="hidden"/>
      <circle id="${p}Dot" r="5" cx="${W}" cy="${y(pts[N].value)}" fill="var(--up)" stroke="var(--bg)" stroke-width="2"/>
    </svg>
    <div class="muted" style="font-size:.75rem;display:flex;justify-content:space-between;padding-inline:4px"><span>heute</span><span>gestrichelt: nur Einzahlungen</span><span>${monthShort(addMonths(ym(new Date()), N))}</span></div>`;
    const svg = box.querySelector("svg");
    const move = ev => {
      const r = svg.getBoundingClientRect();
      const n = Math.round(Math.max(0, Math.min(1, (ev.clientX - r.left) / r.width)) * N);
      const cur = $(p + "Cur"), dot = $(p + "Dot");
      cur.setAttribute("x1", x(n)); cur.setAttribute("x2", x(n)); cur.setAttribute("visibility", "visible");
      dot.setAttribute("cx", x(n)); dot.setAttribute("cy", y(pts[n].value));
      updateHero(p, n, n === 0 ? "Depotwert heute" : `Depotwert ${monthName(addMonths(ym(new Date()), n))}`);
    };
    const leave = () => {
      $(p + "Cur").setAttribute("visibility", "hidden");
      $(p + "Dot").setAttribute("cx", W); $(p + "Dot").setAttribute("cy", y(pts[N].value));
      updateHero(p);
    };
    svg.addEventListener("pointermove", move);
    svg.addEventListener("pointerdown", move);
    svg.addEventListener("pointerleave", leave);
    svg.addEventListener("pointerup", ev => { if (ev.pointerType !== "mouse") leave(); });
  }

    if (t.dataset.salary) monthData(activeWin(), t.dataset.salary).salary = parseNum(t.value);
    else if (t.dataset.field) {
      const row = t.closest(".erow"), item = findList(row.dataset.scope)?.find(i => i.id === row.dataset.id);
      if (!item) return;
      item[t.dataset.field] = t.dataset.field === "amount" ? parseNum(t.value) : t.value;
      if (t.dataset.field === "name") row.querySelectorAll("[data-avoid]").forEach(b => {
        const k = normName(t.value); b.dataset.avoid = k; b.setAttribute("aria-pressed", String(!!k && state.avoid?.[k] === b.dataset.level));
      });
    } else if (t.dataset.srate) {
      const m = monthData(activeWin(), t.dataset.key);
      m.save ||= { mode: "reduced", rates: {} }; m.save.rates ||= {};
      m.save.rates[t.dataset.srate] = parseNum(t.value);
    } else if (t.dataset.gfield) {
      const g = (state.goals || []).find(x => x.id === t.closest(".goal")?.dataset.goal); if (!g) return;
      g[t.dataset.gfield] = t.dataset.gfield === "name" ? t.value : parseNum(t.value);
      if (t.dataset.gfield === "name" && !g.catManual) {
        const c = guessCat(t.value);
        if (c !== g.cat) {
          g.cat = c; liveGoals(g); changed(); render();
          const inp = $("gn-" + g.id); if (inp) { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
          return;
        }
      }
      if (t.dataset.gfield === "name" && g.cat === "uhr" && !g.photo) {
        const spec = JSON.stringify(watchSpec(g)), art = $("ga-" + g.id);
        if (art && art.dataset.spec !== spec) { art.dataset.spec = spec; art.innerHTML = goalArt("uhr", g); }
        const h = $("gwh-" + g.id); if (h) h.textContent = watchHint(g);
      }
      if (t.dataset.gfield === "name") { clearTimeout(nameTimers[g.id]); nameTimers[g.id] = setTimeout(() => autoPhoto(g), 900); }
      liveGoals(g); changed(); return;
    } else if (t.dataset.gpuntil) {
      const g = (state.goals || []).find(x => x.id === t.dataset.gpuntil); if (!g?.pause) return;
      g.pause.until = t.value; liveGoals(g); changed(); return;
    } else if (t.dataset.efield) {
      const et = state.etfs.find(x => x.id === t.closest(".etf").dataset.etf); if (!et) return;
      et[t.dataset.efield] = t.dataset.efield === "name" ? t.value : parseNum(t.value);
    } else return;
    if (ui.tab === "expenses") liveExpenses(); else if (ui.tab === "savings") liveSavings();
    changed();
  });

  document.addEventListener("click", e => {
    const t = e.target.closest("button"); if (!t) return;
    if (t.dataset.tab) return go(t.dataset.tab);
    if (t.dataset.smode) {
      const m = monthData(activeWin(), t.dataset.key);
      if (t.dataset.smode === "normal") delete m.save;
      else m.save = { ...(m.save || {}), mode: t.dataset.smode, rates: m.save?.rates || {} };
      render(); changed(); return;
    }
    if (t.dataset.avoid) {
      if (!t.dataset.avoid) { t.closest(".erow")?.querySelector(".in.name")?.focus(); return; }
      state.avoid ||= {};
      if (state.avoid[t.dataset.avoid] === t.dataset.level) delete state.avoid[t.dataset.avoid]; else state.avoid[t.dataset.avoid] = t.dataset.level;
      render(); changed(); return;
    }
    const goalOf = id => (state.goals || []).find(x => x.id === (id || t.closest(".goal")?.dataset.goal));
    if (t.dataset.gedit) { ui.editGoal = ui.editGoal === t.dataset.gedit ? null : t.dataset.gedit; render(); return; }
    if (t.dataset.gdeposit) { const g = goalOf(t.dataset.gdeposit); g.saved = Math.round(((+g.saved || 0) + (+g.rate || 0)) * 100) / 100; render(); changed(); return; }
    if (t.dataset.gpausetoggle) {
      const g = goalOf(t.dataset.gpausetoggle), now = ym(new Date());
      g.pause = goalPausedIn(g, now) || (g.pause && !g.pause.until) ? null : { from: now, until: null };
      render(); changed(); return;
    }
    if (t.dataset.gcat) { const g = goalOf(); g.cat = t.dataset.gcat; g.catManual = true; render(); changed(); return; }
    if (t.dataset.gwmodel) { const g = goalOf(); g.watch = { ...(g.watch || {}), model: t.dataset.gwmodel }; render(); changed(); return; }
    if (t.dataset.gwcolor) { const g = goalOf(); g.watch = { ...(g.watch || {}), color: t.dataset.gwcolor }; render(); changed(); return; }
    if (t.dataset.gfreq) { const g = goalOf(); g.freq = t.dataset.gfreq; render(); changed(); return; }
    if (t.dataset.gpmode) {
      const g = goalOf(), now = ym(new Date()), from = g.pause?.from && g.pause.from <= now ? g.pause.from : now;
      g.pause = t.dataset.gpmode === "none" ? null : { from, until: t.dataset.gpmode === "until" ? (g.pause?.until || addMonths(now, 3)) : null };
      render(); changed(); return;
    }
    if (t.dataset.gnophoto) { const g = goalOf(t.dataset.gnophoto); delete g.photo; g.web = null; g.noWeb = true; render(); changed(); return; }
    if (t.dataset.gsearch) {
      const g = goalOf(t.dataset.gsearch); photoPicks[g.id] = "loading"; render();
      findPhotos(g).then(list => { photoPicks[g.id] = list; }).catch(() => { photoPicks[g.id] = "error"; }).finally(() => { if (ui.tab === "goals") render(); });
      return;
    }
    if (t.dataset.gpick) {
      const g = goalOf(), x = photoPicks[g.id]?.[+t.dataset.gpick]; if (!x) return;
      delete g.photo; g.noWeb = false; g.web = { ...x, auto: false }; render(); changed(); return;
    }
    if (t.dataset.gurl) {
      const g = goalOf(t.dataset.gurl), v = $("gl-" + g.id).value.trim();
      if (!/^https?:\/\/\S+$/i.test(v)) { $("gl-" + g.id).focus(); return; }
      delete g.photo; g.noWeb = false; g.web = { url: v, auto: false, credit: "", license: "", page: "" }; render(); changed(); return;
    }
    if (t.dataset.gdelete) { $("gdel-" + t.dataset.gdelete).innerHTML = `<span>Wirklich löschen?</span><button class="btn danger" data-gdelyes="${t.dataset.gdelete}">Löschen</button><button class="btn soft" data-grender="1">Abbrechen</button>`; return; }
    if (t.dataset.grender) { render(); return; }
    if (t.dataset.gdelyes) { state.goals = state.goals.filter(x => x.id !== t.dataset.gdelyes); ui.editGoal = null; render(); changed(); return; }
    if (t.dataset.hz) { ui.horizon = +t.dataset.hz; saveUi(); render(); return; }
    if (t.dataset.win) { state.active = t.dataset.win; ui.month = null; render(); changed(); return; }
    if (t.dataset.month) { ui.month = t.dataset.month; saveUi(); render(); return; }
    if (t.dataset.gomonth) { ui.month = t.dataset.gomonth; return go("expenses"); }
    if (t.dataset.add) { const item = { id: uid(), name: "", amount: 0 }; findList(t.dataset.add).push(item); render(); focusLater("n-" + item.id); changed(); return; }
    if (t.dataset.del) { const list = findList(t.dataset.scope), i = list.findIndex(x => x.id === t.dataset.del); if (i >= 0) list.splice(i, 1); render(); changed(); return; }
    if (t.dataset.deletf) { state.etfs = state.etfs.filter(x => x.id !== t.dataset.deletf); render(); changed(); return; }
    switch (t.id) {
      case "addEtf": { const item = { id: uid(), name: "", rate: 0, start: 0, ret: 4 }; state.etfs.push(item); render(); focusLater("en-" + item.id); changed(); break; }
      case "addWin": {
        const last = sortedWins().at(-1), start = addMonths(last.start, 4);
        const lastSalary = monthData(last, addMonths(last.start, 3)).salary, months = {};
        [0, 1, 2, 3].forEach(i => { months[addMonths(start, i)] = { salary: lastSalary, extras: [] }; });
        const w = { id: uid(), start, fixed: last.fixed.map(f => ({ ...f, id: uid() })), months };
        state.windows.push(w); state.active = w.id; ui.month = null; render(); changed(); break;
      }
      case "delWin": $("delWrap").innerHTML = `<span>Wirklich löschen?</span><button class="btn danger" id="delYes">Löschen</button><button class="btn soft" id="delNo">Abbrechen</button>`; break;
      case "delNo": render(); break;
      case "delYes": state.windows = state.windows.filter(x => x.id !== activeWin().id); state.active = sortedWins()[0].id; ui.month = null; render(); changed(); break;
      case "clearExample": state = emptyState(); render(); changed(); break;
      case "addGoal": {
        const g = { id: uid(), name: "", cat: "sonstiges", target: 0, saved: 0, rate: 0, freq: "monthly", pause: null };
        (state.goals ||= []).push(g); ui.editGoal = g.id; render(); focusLater("gn-" + g.id); changed(); break;
      }
      case "exportCopy": copyExport(); break;
      case "exportFile": {
        const a = document.createElement("a");
        a.href = URL.createObjectURL(new Blob([exportJson()], { type: "application/json" }));
        a.download = `finanzplan-backup-${new Date().toISOString().slice(0, 10)}.json`;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(a.href), 2000);
        $("exportMsg").textContent = "Backup-Datei gespeichert."; break;
      }
      case "importPaste": {
        const plan = parseImport($("importText").value);
        if (plan) showImport(plan); else $("importMsg").innerHTML = `<p class="err-msg">Das sind keine gültigen Finanzplan-Daten. Kopiere sie noch einmal vollständig.</p>`;
        break;
      }
      case "importYes": state = migrate(pendingImport); pendingImport = null; ui.tab = "overview"; render(); changed(); window.scrollTo(0, 0); break;
      case "importNo": pendingImport = null; $("importMsg").innerHTML = ""; break;
      case "installBtn": installEvt?.prompt(); installEvt = null; break;
      case "resetAll": $("resetWrap").innerHTML = `<span>Wirklich alles löschen?</span><button class="btn danger" id="resetYes">Löschen</button><button class="btn soft" id="resetNo">Abbrechen</button>`; break;
      case "resetNo": render(); break;
      case "resetYes": state = emptyState(); ui.tab = "overview"; render(); changed(); break;
    }
  });

  document.addEventListener("change", e => {
    if (e.target.dataset?.gphoto && e.target.files?.[0]) { const g = (state.goals || []).find(x => x.id === e.target.dataset.gphoto); if (g) loadPhoto(e.target.files[0], g); return; }
    if (e.target.id !== "importFile" || !e.target.files?.[0]) return;
    e.target.files[0].text().then(text => {
      const plan = parseImport(text);
      if (plan) showImport(plan); else $("importMsg").innerHTML = `<p class="err-msg">Diese Datei ist kein gültiges Finanzplan-Backup.</p>`;
    });
  });
  if (!IN_CLAUDE) navigator.storage?.persist?.().catch(() => {});
  // Foto lädt nicht (offline, gelöscht, Link kaputt): Zeichnung zeigen
  document.addEventListener("error", e => {
    const img = e.target;
    if (!(img instanceof HTMLImageElement)) return;
    if (img.classList.contains("a-photo")) {
      const box = img.closest(".goal-art"), g = (state.goals || []).find(x => "ga-" + x.id === box?.id);
      if (box && g) box.innerHTML = goalArt(g.cat || guessCat(g.name), g);
    } else if (img.closest(".pick")) img.closest(".pick").hidden = true;
  }, true);
  window.addEventListener("beforeunload", () => { if (dirty) localSave(); });
  boot();
})();
</script>
